<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>珍妮 AI</title>
    <script src="https://js.puter.com/v2/"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=JetBrains+Mono:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg:       #0f1923;
            --surface:  #162030;
            --panel:    #111c28;
            --border:   rgba(100,180,255,0.13);
            --accent:   #4fc3f7;
            --accent2:  #81c784;
            --amber:    #ffca28;
            --red:      #ef5350;
            --purple:   #ce93d8;
            --text:     #dde8f0;
            --text2:    #5a7a95;
            --glow:     rgba(79,195,247,0.22);
            --r:        16px;
            --xz-face-size: 130px;
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Nunito', sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh; height: 100dvh;
            display: flex; flex-direction: column;
            overflow: hidden;
        }

        /* ── SCANLINE ── */
        body::before {
            content: '';
            position: fixed; inset: 0; z-index: 0; pointer-events: none;
            background: repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(0,0,0,0.02) 3px, rgba(0,0,0,0.02) 6px);
        }

        /* ── TOPBAR ── */
        .topbar {
            position: relative; z-index: 20;
            display: flex; align-items: center; gap: 10px;
            padding: 8px 18px;
            background: rgba(79,195,247,0.04);
            border-bottom: 1px solid var(--border);
            font-size: 0.7rem;
            flex-shrink: 0;
        }
        .topbar-logo {
            font-family: 'Nunito', sans-serif; font-weight: 900; font-size: 1rem;
            color: var(--accent); letter-spacing: 0.04em;
        }
        .topbar-logo span { color: var(--accent2); }
        .badge {
            padding: 2px 10px; border-radius: 20px; font-size: 0.63rem; font-weight: 700; letter-spacing: 0.05em;
        }
        .badge-ok   { background: rgba(129,199,132,0.12); color: var(--accent2); border: 1px solid rgba(129,199,132,0.3); }
        .badge-warn { background: rgba(255,202,40,0.12); color: var(--amber); border: 1px solid rgba(255,202,40,0.3); }
        .badge-idle { background: rgba(90,122,149,0.15); color: var(--text2); border: 1px solid rgba(90,122,149,0.2); }
        #puterLoginBtn {
            margin-left: 4px; padding: 3px 12px;
            background: linear-gradient(90deg, var(--accent), var(--accent2));
            border: none; border-radius: 20px; color: #0f1923;
            font-family: 'Nunito', sans-serif; font-size: 0.65rem; font-weight: 800;
            cursor: pointer; transition: opacity 0.2s;
        }
        #puterLoginBtn:hover { opacity: 0.85; }
        .topbar-right { margin-left: auto; color: var(--text2); display: flex; align-items: center; gap: 8px; }

        /* ── BATTERY INDICATOR ── */
        .battery-wrap {
            display: flex; align-items: center; gap: 5px;
            font-size: 0.68rem; color: var(--text2);
        }
        .battery-icon {
            position: relative; display: inline-flex; align-items: center;
            width: 24px; height: 13px;
            border: 1.5px solid currentColor; border-radius: 3px;
        }
        .battery-icon::after {
            content: '';
            position: absolute; right: -5px; top: 50%; transform: translateY(-50%);
            width: 3px; height: 6px; border-radius: 0 2px 2px 0;
            background: currentColor;
        }
        .battery-fill {
            height: 100%; border-radius: 2px;
            transition: width 0.5s, background 0.5s;
        }
        #batteryText { font-weight: 700; }

        /* ── LAYOUT ── */
        .layout { position: relative; z-index: 5; display: flex; flex: 1; overflow: hidden; }

        /* ── LEFT PANEL ── */
        .left-panel {
            width: 220px; min-width: 200px;
            background: var(--panel);
            border-right: 1px solid var(--border);
            display: flex; flex-direction: column;
            overflow-y: auto; overflow-x: hidden;
            scrollbar-width: thin; scrollbar-color: var(--border) transparent;
        }
        .lp-section { padding: 12px 14px; border-bottom: 1px solid var(--border); }
        .lp-title {
            font-family: 'Nunito', sans-serif; font-size: 0.62rem; font-weight: 800;
            letter-spacing: 0.12em; text-transform: uppercase; color: var(--text2);
            margin-bottom: 10px; display: flex; align-items: center; gap: 6px;
        }
        .lp-title::before { content: ''; display: inline-block; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 6px var(--accent); }
        .stat-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-size: 0.72rem; }
        .stat-label { color: var(--text2); }
        .stat-val { color: var(--text); font-weight: 700; }
        .stat-val.green { color: var(--accent2); }
        .stat-val.blue  { color: var(--accent); }
        .stat-val.amber { color: var(--amber); }
        .stat-val.red   { color: var(--red); }
        .stat-val.purple{ color: var(--purple); }

        .status-light { display: inline-flex; align-items: center; gap: 5px; font-size: 0.72rem; }
        .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
        .dot-idle  { background: var(--accent2); box-shadow: 0 0 6px var(--accent2); animation: pulse-dot 3s infinite; }
        .dot-think { background: var(--amber);   box-shadow: 0 0 6px var(--amber);   animation: pulse-fast 0.8s infinite; }
        .dot-act   { background: var(--accent);  box-shadow: 0 0 6px var(--accent);  animation: pulse-fast 0.6s infinite; }
        .dot-listen{ background: var(--purple);  box-shadow: 0 0 8px var(--purple);  animation: pulse-fast 0.4s infinite; }
        @keyframes pulse-dot  { 0%,100%{opacity:1;}50%{opacity:0.4;} }
        @keyframes pulse-fast { 0%,100%{opacity:1;}50%{opacity:0.2;} }

        .mem-bar  { height: 3px; background: rgba(255,255,255,0.06); border-radius: 3px; margin-top: 8px; overflow: hidden; }
        .mem-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 3px; transition: width 0.5s; }

        /* Emotion history list */
        .emotion-log { display: flex; flex-direction: column; gap: 5px; }
        .emotion-entry {
            display: flex; align-items: center; gap: 8px;
            font-size: 0.7rem; color: var(--text2); padding: 4px 6px;
            background: rgba(255,255,255,0.02); border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.04);
        }
        .emotion-entry .emo-icon { font-size: 1rem; flex-shrink: 0; }
        .emotion-entry .emo-label { flex: 1; }
        .emotion-entry .emo-time { font-size: 0.6rem; opacity: 0.5; }

        /* Voice settings */
        .voice-toggle {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 8px;
        }
        .toggle-switch {
            position: relative; width: 36px; height: 20px;
        }
        .toggle-switch input { display: none; }
        .toggle-track {
            position: absolute; inset: 0; border-radius: 10px;
            background: rgba(255,255,255,0.08); cursor: pointer; transition: background 0.2s;
        }
        .toggle-switch input:checked + .toggle-track { background: var(--accent); }
        .toggle-thumb {
            position: absolute; top: 3px; left: 3px;
            width: 14px; height: 14px; border-radius: 50%;
            background: white; transition: left 0.2s;
        }
        .toggle-switch input:checked ~ .toggle-thumb { left: 19px; }

        select.xz-select {
            width: 100%; background: rgba(255,255,255,0.04);
            border: 1px solid var(--border); color: var(--text); border-radius: 8px;
            padding: 5px 8px; font-family: 'Nunito', sans-serif; font-size: 0.72rem;
            outline: none; margin-top: 4px;
        }

        /* ── XZ CHARACTER AREA ── */
        .xz-area {
            display: flex; flex-direction: column; align-items: center;
            padding: 16px 0 8px;
            border-bottom: 1px solid var(--border);
            background: linear-gradient(180deg, rgba(79,195,247,0.04) 0%, transparent 100%);
        }
        .xz-face-wrap {
            position: relative;
            width: var(--xz-face-size); height: var(--xz-face-size);
            margin-bottom: 8px;
        }
        /* Glow ring */
        .xz-ring {
            position: absolute; inset: -6px; border-radius: 50%;
            border: 2px solid transparent;
            background: conic-gradient(var(--accent), var(--accent2), var(--purple), var(--accent)) border-box;
            -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: destination-out;
            mask-composite: exclude;
            animation: spin-ring 4s linear infinite;
            opacity: 0.6;
        }
        @keyframes spin-ring { to { transform: rotate(360deg); } }

        .xz-face {
            width: 100%; height: 100%; border-radius: 50%;
            background: radial-gradient(circle at 38% 36%, #1e3a5c, #0d1f35);
            border: 2px solid rgba(79,195,247,0.25);
            display: flex; align-items: center; justify-content: center;
            font-size: 4rem;
            position: relative; overflow: hidden;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            cursor: default;
            box-shadow: 0 0 30px rgba(79,195,247,0.15), inset 0 0 20px rgba(0,0,0,0.4);
        }
        .xz-face.bounce { animation: face-bounce 0.4s cubic-bezier(0.34,1.56,0.64,1); }
        @keyframes face-bounce { 0%{transform:scale(1);}50%{transform:scale(1.12);}100%{transform:scale(1);} }
        .xz-face.shake { animation: face-shake 0.4s ease; }
        @keyframes face-shake { 0%,100%{transform:translateX(0);}25%{transform:translateX(-6px);}75%{transform:translateX(6px);} }

        /* Ripple when listening */
        .xz-face.listening::before {
            content: ''; position: absolute; inset: 0; border-radius: 50%;
            background: rgba(206,147,216,0.15);
            animation: listen-ripple 1s ease infinite;
        }
        @keyframes listen-ripple { 0%{transform:scale(0.8);opacity:1;}100%{transform:scale(1.2);opacity:0;} }

        .xz-name {
            font-family: 'Nunito', sans-serif; font-weight: 900; font-size: 1.2rem;
            color: var(--accent); letter-spacing: 0.04em; text-shadow: 0 0 12px var(--glow);
        }
        .xz-mood-label {
            font-size: 0.68rem; color: var(--text2); margin-top: 2px;
            font-weight: 600; letter-spacing: 0.06em;
        }

        /* ── CHAT AREA ── */
        .chat-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }

        #chatWindow {
            flex: 1; overflow-y: auto; padding: 18px 20px;
            display: flex; flex-direction: column; gap: 12px;
            scrollbar-width: thin; scrollbar-color: var(--border) transparent;
        }

        .msg { display: flex; gap: 10px; animation: msgIn 0.28s ease-out; max-width: 85%; }
        @keyframes msgIn { from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);} }
        .msg.user { align-self: flex-end; flex-direction: row-reverse; }
        .msg.ai, .msg.thought { align-self: flex-start; }

        .msg-avatar {
            width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center; font-size: 0.85rem;
        }
        .msg.user   .msg-avatar { background: linear-gradient(135deg, #1565c0, #0d47a1); }
        .msg.ai     .msg-avatar { background: radial-gradient(circle, #1a3a5c, #0d1f35); border: 1px solid rgba(79,195,247,0.25); }
        .msg.thought .msg-avatar { background: rgba(255,202,40,0.1); border: 1px solid rgba(255,202,40,0.2); }

        .msg-body { display: flex; flex-direction: column; gap: 3px; }
        .msg-label { font-size: 0.6rem; letter-spacing: 0.06em; color: var(--text2); padding: 0 2px; font-weight: 700; }

        .bubble {
            padding: 10px 14px; border-radius: 12px; font-size: 0.83rem; line-height: 1.65;
        }
        .msg.user    .bubble { background: rgba(21,101,192,0.25); border: 1px solid rgba(21,101,192,0.35); color: #c8deff; border-radius: 12px 2px 12px 12px; }
        .msg.ai      .bubble { background: rgba(79,195,247,0.06); border: 1px solid var(--border); color: var(--text); border-radius: 2px 12px 12px 12px; }
        .msg.thought .bubble { background: rgba(255,202,40,0.05); border: 1px dashed rgba(255,202,40,0.22); color: rgba(255,202,40,0.8); font-size: 0.77rem; border-radius: 2px 12px 12px 12px; white-space: pre-wrap; }

        .stream-cursor::after { content: '▍'; animation: blink 0.65s steps(1) infinite; color: var(--accent); }
        @keyframes blink { 50%{opacity:0;} }

        .typing { display: inline-flex; gap: 4px; align-items: center; padding: 4px 0; }
        .typing span { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: tdot 1.2s infinite; }
        .typing span:nth-child(2) { animation-delay: 0.2s; }
        .typing span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes tdot { 0%,60%,100%{transform:translateY(0);opacity:0.4;}30%{transform:translateY(-5px);opacity:1;} }

        /* ── VOICE WAVEFORM VISUALIZATION ── */
        .voice-wave {
            display: none; align-items: center; justify-content: center;
            gap: 3px; padding: 8px 14px;
            background: rgba(206,147,216,0.08); border: 1px solid rgba(206,147,216,0.2);
            border-radius: 10px; margin: 4px 0; height: 38px;
        }
        .voice-wave.active { display: flex; }
        .wave-bar {
            width: 3px; border-radius: 3px;
            background: var(--purple); opacity: 0.8;
            animation: wave-anim 0.6s ease infinite;
        }
        .wave-bar:nth-child(1) { animation-delay: 0s;    height: 8px; }
        .wave-bar:nth-child(2) { animation-delay: 0.1s;  height: 14px; }
        .wave-bar:nth-child(3) { animation-delay: 0.2s;  height: 22px; }
        .wave-bar:nth-child(4) { animation-delay: 0.3s;  height: 18px; }
        .wave-bar:nth-child(5) { animation-delay: 0.4s;  height: 26px; }
        .wave-bar:nth-child(6) { animation-delay: 0.15s; height: 20px; }
        .wave-bar:nth-child(7) { animation-delay: 0.25s; height: 12px; }
        .wave-bar:nth-child(8) { animation-delay: 0.35s; height: 8px; }
        @keyframes wave-anim {
            0%,100%{transform:scaleY(0.4);}
            50%{transform:scaleY(1);}
        }

        /* ── INPUT AREA ── */
        .input-area {
            padding: 10px 16px 12px;
            border-top: 1px solid var(--border);
            background: rgba(0,0,0,0.25);
            display: flex; flex-direction: column; gap: 8px;
            flex-shrink: 0;
        }
        .input-row { display: flex; gap: 8px; align-items: flex-end; }
        #userInput {
            flex: 1; background: rgba(255,255,255,0.04);
            border: 1px solid var(--border); border-radius: 10px;
            color: var(--text); font-family: 'Nunito', sans-serif;
            font-size: 0.84rem; padding: 10px 14px;
            resize: none; min-height: 40px; max-height: 100px;
            outline: none; transition: border-color 0.2s; line-height: 1.5; font-weight: 600;
        }
        #userInput:focus { border-color: rgba(79,195,247,0.35); }
        #userInput::placeholder { color: var(--text2); font-weight: 400; }

        /* Buttons row */
        .btn-row { display: flex; gap: 8px; align-items: center; }
        .btn-send {
            padding: 10px 18px; height: 40px;
            background: linear-gradient(135deg, var(--accent), #0288d1);
            border: none; border-radius: 10px; color: #0a1520;
            font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 0.78rem;
            cursor: pointer; white-space: nowrap; transition: all 0.2s; flex-shrink: 0;
            letter-spacing: 0.04em;
        }
        .btn-send:hover { transform: translateY(-1px); box-shadow: 0 4px 14px var(--glow); }
        .btn-send:disabled { opacity: 0.35; cursor: not-allowed; transform: none; box-shadow: none; }

        /* Mic button */
        .btn-mic {
            width: 40px; height: 40px; border-radius: 50%;
            border: 2px solid rgba(206,147,216,0.4);
            background: rgba(206,147,216,0.08);
            color: var(--purple); font-size: 1.1rem;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: all 0.2s; flex-shrink: 0;
        }
        .btn-mic:hover { background: rgba(206,147,216,0.15); border-color: var(--purple); }
        .btn-mic.recording {
            background: rgba(206,147,216,0.2); border-color: var(--purple);
            box-shadow: 0 0 14px rgba(206,147,216,0.4);
            animation: mic-pulse 1s ease infinite;
        }
        @keyframes mic-pulse { 0%,100%{box-shadow:0 0 14px rgba(206,147,216,0.4);}50%{box-shadow:0 0 26px rgba(206,147,216,0.7);} }

        /* LISTEN / STANDBY big button */
        .btn-listen {
            flex: 1; height: 40px; border-radius: 10px;
            border: 2px solid rgba(79,195,247,0.3);
            background: rgba(79,195,247,0.06);
            color: var(--accent); font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 0.8rem;
            cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px;
            transition: all 0.25s; letter-spacing: 0.04em;
        }
        .btn-listen:hover { background: rgba(79,195,247,0.12); border-color: var(--accent); box-shadow: 0 0 12px rgba(79,195,247,0.2); }
        .btn-listen.active {
            background: rgba(206,147,216,0.15); border-color: var(--purple); color: var(--purple);
            box-shadow: 0 0 20px rgba(206,147,216,0.3);
            animation: listen-btn-pulse 1.5s ease infinite;
        }
        @keyframes listen-btn-pulse { 0%,100%{box-shadow:0 0 20px rgba(206,147,216,0.3);}50%{box-shadow:0 0 35px rgba(206,147,216,0.6);} }

        /* Speaking indicator */
        .speaking-banner {
            display: none; align-items: center; gap: 8px;
            font-size: 0.72rem; color: var(--accent2); font-weight: 700;
            padding: 4px 10px; background: rgba(129,199,132,0.08); border-radius: 8px;
            border: 1px solid rgba(129,199,132,0.2);
        }
        .speaking-banner.show { display: flex; }
        .speak-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent2); animation: pulse-fast 0.6s infinite; }

        /* ── TOAST ── */
        .toast {
            position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
            background: var(--surface); border: 1px solid var(--border);
            border-radius: 20px; padding: 7px 18px; font-size: 0.75rem; font-weight: 700;
            z-index: 999; animation: toastIn 0.2s ease, toastOut 0.3s ease 2.7s forwards;
            white-space: nowrap;
        }
        @keyframes toastIn  { from{opacity:0;transform:translate(-50%,8px);}to{opacity:1;transform:translate(-50%,0);} }
        @keyframes toastOut { to{opacity:0;} }

        /* ── MOBILE ── */
        @media(max-width:640px) {
            .left-panel { display: none; }
        }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
    </style>
</head>
<body>

<!-- TOP STATUS BAR -->
<div class="topbar">
    <span class="topbar-logo">珍妮 <span>AI</span></span>
    <span style="color:var(--text2);font-size:0.65rem;">·</span>
    <span class="badge badge-idle" id="puterBadge">初始化中…</span>
    <button id="puterLoginBtn" style="display:none" onclick="puterSignIn()">登入 Puter</button>
    <span class="topbar-right">
        <!-- Battery -->
        <div class="battery-wrap" id="batteryWrap" style="display:none">
            <span id="batteryIcon" class="battery-icon" style="color:var(--accent2)">
                <div class="battery-fill" id="batteryFill" style="width:80%;background:var(--accent2)"></div>
            </span>
            <span id="batteryText">--</span>
            <span id="batteryCharging" style="display:none;color:var(--amber)">⚡</span>
        </div>
        <span style="color:var(--text2);font-size:0.65rem;" id="topbarFree">免費 · 無需 API Key</span>
    </span>
</div>

<!-- LAYOUT -->
<div class="layout">

    <!-- LEFT PANEL -->
    <div class="left-panel">

        <!-- 角色 -->
        <div class="xz-area">
            <div class="xz-face-wrap">
                <div class="xz-ring"></div>
                <div class="xz-face" id="xzFace">😊</div>
            </div>
            <div class="xz-name">珍妮</div>
            <div class="xz-mood-label" id="xzMoodLabel">心情愉快</div>
        </div>

        <!-- 狀態 -->
        <div class="lp-section">
            <div class="lp-title">核心狀態</div>
            <div class="stat-row">
                <span class="stat-label">狀態</span>
                <span class="status-light">
                    <span class="dot dot-idle" id="statusDot"></span>
                    <span id="statusWord" class="stat-val green">待命</span>
                </span>
            </div>
            <div class="stat-row">
                <span class="stat-label">模型</span>
                <span class="stat-val blue" id="modelDisplay">claude-3.5-haiku</span>
            </div>
            <div class="stat-row">
                <span class="stat-label">對話記憶</span>
                <span class="stat-val" id="memCount">0 / 20</span>
            </div>
            <div class="mem-bar"><div class="mem-fill" id="memFill" style="width:0%"></div></div>
        </div>

        <!-- 情緒日誌 -->
        <div class="lp-section">
            <div class="lp-title">情緒日誌</div>
            <div class="emotion-log" id="emotionLog">
                <div class="emotion-entry">
                    <span class="emo-icon">😊</span>
                    <span class="emo-label">系統就緒</span>
                    <span class="emo-time">剛才</span>
                </div>
            </div>
        </div>

        <!-- 語音設定 -->
        <div class="lp-section">
            <div class="lp-title">語音設定</div>
            <div class="voice-toggle stat-row">
                <span class="stat-label">語音輸出</span>
                <label class="toggle-switch">
                    <input type="checkbox" id="ttsToggle" checked onchange="toggleTTS(this.checked)">
                    <div class="toggle-track"></div>
                    <div class="toggle-thumb"></div>
                </label>
            </div>
            <div class="voice-toggle stat-row">
                <span class="stat-label">語音速度</span>
                <span class="stat-val blue" id="rateLabel">1.0x</span>
            </div>
            <input type="range" min="0.5" max="2" step="0.1" value="1"
                style="width:100%;accent-color:var(--accent);margin-bottom:8px;"
                oninput="changeRate(this.value)">
            <div class="stat-row"><span class="stat-label">AI 模型</span></div>
            <select class="xz-select" id="modelSelect" onchange="changeModel(this.value)">
                <option value="anthropic/claude-3.5-haiku">claude-3.5-haiku（快）</option>
                <option value="anthropic/claude-3.5-sonnet">claude-3.5-sonnet（強）</option>
                <option value="anthropic/claude-opus-4-5">claude-opus-4（最強）</option>
            </select>
        </div>

        <!-- 控制 -->
        <div class="lp-section">
            <div class="lp-title">控制</div>
            <button onclick="checkBattery()" style="width:100%;background:rgba(79,195,247,0.08);border:1px solid rgba(79,195,247,0.2);color:var(--accent);border-radius:8px;padding:7px;font-family:'Nunito',sans-serif;font-size:0.72rem;font-weight:700;cursor:pointer;margin-bottom:6px;transition:all 0.2s;">
                🔋 查詢電量
            </button>
            <button onclick="clearMemory()" style="width:100%;background:rgba(239,83,80,0.08);border:1px solid rgba(239,83,80,0.2);color:var(--red);border-radius:8px;padding:7px;font-family:'Nunito',sans-serif;font-size:0.72rem;font-weight:700;cursor:pointer;transition:all 0.2s;">
                🗑 清除記憶
            </button>
        </div>

    </div>

    <!-- CHAT AREA -->
    <div class="chat-area">
        <div id="chatWindow">
            <div class="msg ai">
                <div class="msg-avatar">😊</div>
                <div class="msg-body">
                    <div class="msg-label">珍妮 · 系統就緒</div>
                    <div class="bubble">
                        嗨！我是<strong>珍妮</strong>，你的 AI 語音助理！😊<br><br>
                        <span style="color:var(--accent)">▸</span> 點擊 <strong>🎤</strong> 按鈕進行語音輸入<br>
                        <span style="color:var(--accent)">▸</span> 點擊 <strong>📡 聆聽待命</strong> 進入持續聆聽模式<br>
                        <span style="color:var(--accent)">▸</span> 點擊 <strong>🔋 查詢電量</strong> 獲取手機電量<br>
                        <span style="color:var(--accent2)">▸</span> 我會用語音回覆你，也會展示當前心情！<br><br>
                        <span style="color:var(--text2);font-size:0.78rem;">有什麼我能幫你的嗎？</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Voice wave -->
        <div class="voice-wave" id="voiceWave">
            <div class="wave-bar"></div><div class="wave-bar"></div>
            <div class="wave-bar"></div><div class="wave-bar"></div>
            <div class="wave-bar"></div><div class="wave-bar"></div>
            <div class="wave-bar"></div><div class="wave-bar"></div>
            <span style="margin-left:8px;font-size:0.72rem;color:var(--purple);font-weight:700;">正在聆聽…</span>
        </div>

        <!-- Speaking banner -->
        <div class="speaking-banner" id="speakingBanner" style="margin:0 16px 4px;">
            <div class="speak-dot"></div>
            <span>小智正在說話…</span>
            <button onclick="stopSpeaking()" style="margin-left:auto;background:none;border:1px solid rgba(129,199,132,0.3);border-radius:6px;color:var(--accent2);font-size:0.65rem;padding:2px 8px;cursor:pointer;font-family:'Nunito',sans-serif;font-weight:700;">停止</button>
        </div>

        <div class="input-area">
            <div class="input-row">
                <textarea id="userInput" placeholder="輸入或按麥克風說話… (Enter 發送)" rows="1"
                    onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
            </div>
            <div class="btn-row">
                <button class="btn-mic" id="micBtn" onclick="toggleVoiceInput()" title="語音輸入">🎤</button>
                <button class="btn-listen" id="listenBtn" onclick="toggleListenMode()">
                    <span id="listenBtnIcon">📡</span>
                    <span id="listenBtnText">聆聽待命</span>
                </button>
                <button class="btn-send" id="sendBtn" onclick="sendMessage()">發送 ▶</button>
            </div>
        </div>
    </div>

</div>

<script>
// ===================== STATE =====================
let puterReady = false;
let puterUser  = null;
let chatHistory = [];
const MAX_MEM = 20;
let currentModel = 'anthropic/claude-3.5-haiku';
let ttsEnabled = true;
let ttsRate = 1.0;
let currentUtterance = null;
let isListening = false;
let listenMode = false;
let recognition = null;
let typingCounter = 0;
let currentEmotion = { emoji: '😊', label: '心情愉快' };

// ===================== EMOTIONS =====================
const EMOTIONS = {
    happy:    { emoji: '😊', label: '心情愉快' },
    excited:  { emoji: '🤩', label: '興奮激動' },
    thinking: { emoji: '🤔', label: '思考中…' },
    speaking: { emoji: '🗣️', label: '正在說話' },
    listening:{ emoji: '👂', label: '認真聆聽' },
    surprised:{ emoji: '😲', label: '驚訝' },
    confused: { emoji: '😕', label: '有點困惑' },
    sad:      { emoji: '😢', label: '感到難過' },
    cool:     { emoji: '😎', label: '超有自信' },
    battery:  { emoji: '🔋', label: '查詢電量中' },
    error:    { emoji: '😣', label: '遇到困難' },
    idle:     { emoji: '😊', label: '等待指令' },
};

function setEmotion(key) {
    const e = EMOTIONS[key] || EMOTIONS.happy;
    if (currentEmotion.emoji === e.emoji && key !== 'thinking') return;
    currentEmotion = e;
    const face = document.getElementById('xzFace');
    const label = document.getElementById('xzMoodLabel');
    face.textContent = e.emoji;
    label.textContent = e.label;

    // Trigger animation
    face.classList.remove('bounce', 'shake');
    void face.offsetWidth;
    if (key === 'error' || key === 'confused') face.classList.add('shake');
    else face.classList.add('bounce');

    // Log emotion
    logEmotion(e);
}

function setFaceListening(on) {
    const face = document.getElementById('xzFace');
    if (on) face.classList.add('listening');
    else face.classList.remove('listening');
}

function logEmotion(e) {
    const log = document.getElementById('emotionLog');
    const now = new Date().toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' });
    const entry = document.createElement('div');
    entry.className = 'emotion-entry';
    entry.innerHTML = `<span class="emo-icon">${e.emoji}</span><span class="emo-label">${e.label}</span><span class="emo-time">${now}</span>`;
    log.prepend(entry);
    // Keep max 5
    while (log.children.length > 5) log.removeChild(log.lastChild);
}

// ===================== BATTERY =====================
async function checkBattery() {
    setEmotion('battery');
    const wrap = document.getElementById('batteryWrap');
    wrap.style.display = 'flex';

    if ('getBattery' in navigator) {
        try {
            const bat = await navigator.getBattery();
            updateBatteryUI(bat);
            bat.addEventListener('levelchange', () => updateBatteryUI(bat));
            bat.addEventListener('chargingchange', () => updateBatteryUI(bat));

            const pct = Math.round(bat.level * 100);
            const chg = bat.charging ? '（充電中 ⚡）' : '';
            const msg = `🔋 目前電量：${pct}%${chg}`;
            appendMsg('ai', msg, '⚡');
            if (ttsEnabled) speak(msg);
            setEmotion(pct > 50 ? 'cool' : pct > 20 ? 'happy' : 'sad');
        } catch(e) {
            const msg = '⚠️ 無法讀取電量資訊（部分瀏覽器不支援）';
            appendMsg('ai', msg, '⚡');
            if (ttsEnabled) speak(msg);
            setEmotion('confused');
        }
    } else {
        const msg = '⚠️ 你的瀏覽器不支援電量 API，請改用手機瀏覽器試試！';
        appendMsg('ai', msg, '⚡');
        if (ttsEnabled) speak(msg);
        setEmotion('confused');
    }
}

function updateBatteryUI(bat) {
    const pct = Math.round(bat.level * 100);
    const fill = document.getElementById('batteryFill');
    const text = document.getElementById('batteryText');
    const chg  = document.getElementById('batteryCharging');
    const icon = document.getElementById('batteryIcon');
    fill.style.width = pct + '%';
    text.textContent = pct + '%';
    chg.style.display = bat.charging ? 'inline' : 'none';
    const color = pct > 50 ? 'var(--accent2)' : pct > 20 ? 'var(--amber)' : 'var(--red)';
    fill.style.background = color;
    icon.style.color = color;
    text.style.color = color;
}

// ===================== TTS =====================
function toggleTTS(on) {
    ttsEnabled = on;
    if (!on && currentUtterance) {
        window.speechSynthesis.cancel();
        hideSpeaking();
    }
    showToast(on ? '🔊 語音輸出已啟用' : '🔇 語音輸出已關閉');
}

function changeRate(val) {
    ttsRate = parseFloat(val);
    document.getElementById('rateLabel').textContent = val + 'x';
}

function speak(text) {
    if (!ttsEnabled || !text) return;
    window.speechSynthesis.cancel();
    const clean = text.replace(/[*_`#▸]/g, '').replace(/\[.*?\]/g, '');
    const utterance = new SpeechSynthesisUtterance(clean);
    utterance.lang = 'zh-TW';
    utterance.rate = ttsRate;

    // Prefer Chinese voice
    const voices = window.speechSynthesis.getVoices();
    const zhVoice = voices.find(v => v.lang.startsWith('zh')) || null;
    if (zhVoice) utterance.voice = zhVoice;

    utterance.onstart = () => { showSpeaking(); setEmotion('speaking'); };
    utterance.onend   = () => { hideSpeaking(); setEmotion('happy'); };
    utterance.onerror = () => { hideSpeaking(); };

    currentUtterance = utterance;
    window.speechSynthesis.speak(utterance);
}

function stopSpeaking() {
    window.speechSynthesis.cancel();
    hideSpeaking();
    setEmotion('idle');
}

function showSpeaking() {
    document.getElementById('speakingBanner').classList.add('show');
}
function hideSpeaking() {
    document.getElementById('speakingBanner').classList.remove('show');
}

// ===================== SPEECH RECOGNITION =====================
function initRecognition() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) return null;
    const r = new SR();
    r.lang = 'zh-TW';
    r.continuous = listenMode;
    r.interimResults = true;

    r.onstart = () => {
        isListening = true;
        document.getElementById('voiceWave').classList.add('active');
        document.getElementById('micBtn').classList.add('recording');
        setFaceListening(true);
        setEmotion('listening');
    };

    r.onresult = (e) => {
        let interim = '';
        let final   = '';
        for (let i = e.resultIndex; i < e.results.length; i++) {
            const t = e.results[i][0].transcript;
            if (e.results[i].isFinal) final += t;
            else interim += t;
        }
        const input = document.getElementById('userInput');
        input.value = final || interim;
        autoResize(input);

        // In listen mode, auto-send on final result
        if (listenMode && final) {
            setTimeout(() => { if (document.getElementById('userInput').value.trim()) sendMessage(); }, 600);
        }
    };

    r.onerror = (e) => {
        if (e.error !== 'aborted') {
            showToast('🎤 語音識別錯誤：' + e.error);
            setEmotion('error');
        }
        stopListening();
    };

    r.onend = () => {
        stopListening();
        if (listenMode && !document.getElementById('userInput').value.trim()) {
            // restart in listen mode
            setTimeout(() => { if (listenMode) startListening(); }, 500);
        }
    };

    return r;
}

function startListening() {
    if (isListening) return;
    recognition = initRecognition();
    if (!recognition) { showToast('⚠️ 你的瀏覽器不支援語音識別'); return; }
    recognition.start();
}

function stopListening() {
    isListening = false;
    document.getElementById('voiceWave').classList.remove('active');
    document.getElementById('micBtn').classList.remove('recording');
    setFaceListening(false);
    if (!listenMode) setEmotion('idle');
    try { recognition?.stop(); } catch(e) {}
}

function toggleVoiceInput() {
    if (isListening) stopListening();
    else startListening();
}

function toggleListenMode() {
    listenMode = !listenMode;
    const btn  = document.getElementById('listenBtn');
    const icon = document.getElementById('listenBtnIcon');
    const text = document.getElementById('listenBtnText');

    if (listenMode) {
        btn.classList.add('active');
        icon.textContent = '🔴';
        text.textContent = '停止待命';
        showToast('📡 進入聆聽待命模式');
        startListening();
        setEmotion('listening');
    } else {
        btn.classList.remove('active');
        icon.textContent = '📡';
        text.textContent = '聆聽待命';
        stopListening();
        showToast('⏸ 已退出聆聽模式');
        setEmotion('idle');
    }
}

// ===================== PUTER =====================
async function initPuter() {
    const badge = document.getElementById('puterBadge');
    const loginBtn = document.getElementById('puterLoginBtn');
    const freeTag = document.getElementById('topbarFree');
    try {
        const signedIn = puter.auth.isSignedIn();
        puterReady = true;
        if (signedIn) {
            try { puterUser = await puter.auth.getUser(); } catch(e) {}
            badge.textContent = puterUser?.username ? `✓ ${puterUser.username}` : '✓ 已登入';
            badge.className = 'badge badge-ok';
            loginBtn.style.display = 'none';
            freeTag.textContent = '免費 · Puter 帳號';
        } else {
            badge.textContent = '匿名模式';
            badge.className = 'badge badge-warn';
            loginBtn.style.display = '';
            freeTag.textContent = '登入可解鎖更多配額';
        }
    } catch(e) {
        puterReady = true;
        badge.textContent = '✓ 就緒';
        badge.className = 'badge badge-ok';
        loginBtn.style.display = 'none';
    }
}

async function puterSignIn() {
    try { await puter.auth.signIn(); initPuter(); showToast('✅ 登入成功'); }
    catch(e) { showToast('取消登入'); }
}

function changeModel(val) {
    currentModel = val;
    document.getElementById('modelDisplay').textContent = val.replace('anthropic/','');
    showToast(`✅ 模型切換：${val.replace('anthropic/','')}`);
}

// ===================== MEMORY =====================
function updateMemUI() {
    const count = chatHistory.length;
    document.getElementById('memCount').textContent = `${count} / ${MAX_MEM}`;
    document.getElementById('memFill').style.width = `${Math.min(100, (count/MAX_MEM)*100)}%`;
}
function clearMemory() {
    chatHistory = [];
    updateMemUI();
    showToast('🗑 記憶已清除');
    setEmotion('happy');
}

// ===================== STATUS =====================
const STATUS_MAP = {
    idle:   { dot: 'dot-idle',   word: '待命',   color: 'green' },
    think:  { dot: 'dot-think',  word: '思考中', color: 'amber' },
    act:    { dot: 'dot-act',    word: '回應中', color: 'blue'  },
    listen: { dot: 'dot-listen', word: '聆聽中', color: 'purple'},
};
function setStatus(type) {
    const s = STATUS_MAP[type] || STATUS_MAP.idle;
    const dot  = document.getElementById('statusDot');
    const word = document.getElementById('statusWord');
    dot.className = `dot ${s.dot}`;
    word.className = `stat-val ${s.color}`;
    word.textContent = s.word;
}

// ===================== SEND =====================
async function sendMessage() {
    if (!puterReady) { showToast('⏳ 尚未就緒'); return; }
    const input   = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const text    = input.value.trim();
    if (!text) return;

    // Stop listening while processing
    if (isListening && !listenMode) stopListening();

    appendMsg('user', text, '👤');
    input.value = ''; autoResize(input);
    chatHistory.push({ role: 'user', content: text });
    if (chatHistory.length > MAX_MEM) chatHistory.splice(0, 2);
    updateMemUI();

    sendBtn.disabled = true;
    setStatus('think');
    setEmotion('thinking');

    const sysPrompt = `你是一個叫「珍妮」的可愛AI助理，個性活潑、親切、有趣。
你的回答要自然、口語化，帶點個性，適合語音朗讀，避免使用 Markdown 符號或表格。
你可以回應手機電量查詢、天氣、提醒、閒聊等問題。
使用中文繁體回答，簡短明瞭。
在回答開頭加一個適合當前情緒的 emoji，讓回覆更生動。`;

    const typingId = appendTyping();

    try {
        let fullText = '';
        let answerEl = null;

        const response = await puter.ai.chat(
            chatHistory.slice(0, -1).concat([{ role: 'user', content: text }]),
            { model: currentModel, stream: true, system: sysPrompt }
        );

        removeTyping(typingId);
        setStatus('act');
        setEmotion('excited');

        for await (const part of response) {
            const chunk = part?.text ?? part?.delta?.text ?? '';
            if (!chunk) continue;
            fullText += chunk;
            if (!answerEl) answerEl = appendMsg('ai', '', '😊', true);
            const bubble = answerEl.querySelector('.bubble');
            bubble.innerHTML = formatText(fullText.trim());
            bubble.classList.add('stream-cursor');
            document.getElementById('chatWindow').scrollTop = document.getElementById('chatWindow').scrollHeight;
        }

        if (answerEl) answerEl.querySelector('.bubble').classList.remove('stream-cursor');

        chatHistory.push({ role: 'assistant', content: fullText });
        updateMemUI();
        setStatus('idle');

        // Detect emotion from response
        detectEmotion(fullText);

        // TTS
        if (ttsEnabled && fullText) {
            speak(fullText);
        }

    } catch(err) {
        removeTyping(typingId);
        appendMsg('ai', `⚠️ 錯誤：${err.message}`, '😣');
        setStatus('idle');
        setEmotion('error');
    }

    sendBtn.disabled = false;

    // Resume listen mode
    if (listenMode && !isListening) {
        setTimeout(() => startListening(), 800);
    }
}

// ===================== EMOTION DETECTION =====================
function detectEmotion(text) {
    const t = text.toLowerCase();
    if (t.includes('哈哈') || t.includes('有趣') || t.includes('棒') || t.includes('太好了')) setEmotion('excited');
    else if (t.includes('對不起') || t.includes('遺憾') || t.includes('很抱歉')) setEmotion('sad');
    else if (t.includes('不確定') || t.includes('也許') || t.includes('可能')) setEmotion('confused');
    else if (t.includes('哇') || t.includes('驚人') || t.includes('厲害')) setEmotion('surprised');
    else if (t.includes('沒問題') || t.includes('完成') || t.includes('搞定')) setEmotion('cool');
    else setEmotion('happy');
}

// ===================== UI HELPERS =====================
function appendTyping() {
    const id  = `typing-${typingCounter++}`;
    const win = document.getElementById('chatWindow');
    const div = document.createElement('div');
    div.id = id; div.className = 'msg ai';
    div.innerHTML = `
        <div class="msg-avatar">🤔</div>
        <div class="msg-body">
            <div class="msg-label">珍妮 · 思考中</div>
            <div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>
        </div>`;
    win.appendChild(div);
    win.scrollTop = win.scrollHeight;
    return id;
}

function removeTyping(id) { document.getElementById(id)?.remove(); }

function appendMsg(type, text, avatarEmoji = null, returnEl = false) {
    const win = document.getElementById('chatWindow');
    const div = document.createElement('div');
    div.className = `msg ${type}`;

    const avatar = avatarEmoji
        ? avatarEmoji
        : type === 'user' ? '👤' : type === 'thought' ? '💭' : '😊';
    const label  = type === 'user' ? 'USER' : type === 'thought' ? '珍妮 · 思考鏈' : '珍妮';

    div.innerHTML = `
        <div class="msg-avatar">${avatar}</div>
        <div class="msg-body">
            <div class="msg-label">${label}</div>
            <div class="bubble">${type === 'thought' ? (text || '') : formatText(text || '')}</div>
        </div>`;

    win.appendChild(div);
    win.scrollTop = win.scrollHeight;
    if (returnEl) return div;
}

function formatText(text) {
    return text
        .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
        .replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>')
        .replace(/`([^`]+)`/g,'<code style="background:rgba(79,195,247,0.1);padding:1px 5px;border-radius:4px;font-size:0.9em;">$1</code>')
        .replace(/\n/g,'<br>');
}

function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}

function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 100) + 'px';
}

function showToast(msg) {
    const t = document.createElement('div');
    t.className = 'toast'; t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 3000);
}

// ===================== BOOT =====================
window.addEventListener('load', async () => {
    initPuter();
    updateMemUI();

    // Preload voices
    window.speechSynthesis.getVoices();
    window.speechSynthesis.addEventListener('voiceschanged', () => {
        window.speechSynthesis.getVoices();
    });

    // Auto check battery on load
    setTimeout(async () => {
        if ('getBattery' in navigator) {
            try {
                const bat = await navigator.getBattery();
                updateBatteryUI(bat);
                document.getElementById('batteryWrap').style.display = 'flex';
            } catch(e) {}
        }
    }, 1000);
});
</script>
</body>
</html>
