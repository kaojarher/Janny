<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>小智 AI · 智慧語音助手</title>
<script src="https://js.puter.com/v2/"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+TC:wght@300;400;500;700&family=JetBrains+Mono:wght@300;400;600&display=swap');

:root {
  --c0: #020408;
  --c1: #050c14;
  --c2: #0a1628;
  --cyan: #00d4ff;
  --cyan2: #00ffee;
  --purple: #7b2fff;
  --purple2: #b06aff;
  --green: #00ff88;
  --red: #ff2a5e;
  --amber: #ffb700;
  --text: #c8dff0;
  --sub: #4a6a84;
  --border: rgba(0,212,255,0.12);
  --glow-c: 0 0 20px rgba(0,212,255,0.4);
  --glow-p: 0 0 20px rgba(123,47,255,0.5);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%; height: 100%;
  background: var(--c0);
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
  font-family: 'Noto Sans TC', sans-serif;
}

/* ── Starfield ── */
body::before {
  content: '';
  position: fixed; inset: 0;
  background-image:
    radial-gradient(1px 1px at 10% 20%, rgba(0,212,255,0.5) 0%, transparent 100%),
    radial-gradient(1px 1px at 30% 60%, rgba(123,47,255,0.4) 0%, transparent 100%),
    radial-gradient(1px 1px at 55% 10%, rgba(0,255,238,0.3) 0%, transparent 100%),
    radial-gradient(1px 1px at 75% 80%, rgba(0,212,255,0.4) 0%, transparent 100%),
    radial-gradient(1px 1px at 90% 40%, rgba(176,106,255,0.5) 0%, transparent 100%),
    radial-gradient(2px 2px at 20% 85%, rgba(0,255,136,0.3) 0%, transparent 100%),
    radial-gradient(1px 1px at 45% 45%, rgba(0,212,255,0.6) 0%, transparent 100%),
    radial-gradient(2px 2px at 65% 25%, rgba(123,47,255,0.3) 0%, transparent 100%),
    radial-gradient(1px 1px at 85% 65%, rgba(0,255,238,0.4) 0%, transparent 100%),
    radial-gradient(1px 1px at 5% 50%, rgba(176,106,255,0.4) 0%, transparent 100%);
  pointer-events: none;
  animation: starDrift 20s linear infinite alternate;
}

body::after {
  content: '';
  position: fixed; inset: 0;
  background:
    radial-gradient(ellipse 60% 40% at 15% 25%, rgba(123,47,255,0.08) 0%, transparent 60%),
    radial-gradient(ellipse 50% 60% at 85% 75%, rgba(0,212,255,0.07) 0%, transparent 60%),
    radial-gradient(ellipse 40% 30% at 50% 50%, rgba(0,255,136,0.03) 0%, transparent 70%);
  pointer-events: none;
  animation: nebula 12s ease-in-out infinite alternate;
}

@keyframes starDrift { 0%{opacity:0.6} 100%{opacity:1} }
@keyframes nebula { 0%{opacity:0.5;transform:scale(1)} 100%{opacity:1;transform:scale(1.05)} }

/* ── Phone Shell ── */
.phone {
  width: 370px;
  height: 780px;
  background: linear-gradient(160deg, #060e1c 0%, #030810 100%);
  border-radius: 44px;
  border: 1.5px solid rgba(0,212,255,0.18);
  box-shadow:
    0 0 0 1px rgba(0,0,0,0.8),
    0 0 40px rgba(0,212,255,0.12),
    0 0 80px rgba(123,47,255,0.08),
    inset 0 1px 0 rgba(0,212,255,0.1),
    inset 0 -1px 0 rgba(0,0,0,0.5);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
}

/* scan line effect */
.phone::before {
  content: '';
  position: absolute; inset: 0;
  background: repeating-linear-gradient(
    0deg, transparent, transparent 2px,
    rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px
  );
  pointer-events: none;
  z-index: 100;
  border-radius: 44px;
}

/* ── Puter Banner ── */
.puter-banner {
  display:flex; align-items:center; justify-content:space-between;
  padding: 7px 16px;
  background: rgba(123,47,255,0.1);
  border-bottom: 0.5px solid rgba(123,47,255,0.25);
  flex-shrink: 0;
  position: relative; z-index: 10;
}
.puter-banner.ok {
  background: rgba(0,255,136,0.06);
  border-color: rgba(0,255,136,0.2);
}
.puter-info { font-size:10px; color:var(--sub); }
.puter-info span { color: var(--purple2); font-weight:500; }
.puter-info.ok span { color: var(--green); }
.puter-action {
  padding: 4px 12px; border-radius: 10px;
  border: 0.5px solid rgba(123,47,255,0.45);
  background: rgba(123,47,255,0.18);
  color: var(--purple2); font-size:10px; font-weight:600;
  cursor:pointer; transition:all 0.2s;
  font-family:'Noto Sans TC',sans-serif;
}
.puter-action:hover { background:rgba(123,47,255,0.35); transform:scale(1.04); }
.puter-action.signout {
  border-color:rgba(255,42,94,0.3);
  background:rgba(255,42,94,0.08);
  color:var(--red);
}

/* ── Status Bar ── */
.statusbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 22px 8px;
  background: rgba(0,0,0,0.4);
  border-bottom: 0.5px solid var(--border);
  flex-shrink: 0;
}
.sb-left { display: flex; flex-direction: column; gap: 1px; }
.sb-time {
  font-family: 'Orbitron', monospace; font-size: 20px; font-weight: 700;
  color: var(--cyan); letter-spacing: 3px;
  text-shadow: 0 0 12px rgba(0,212,255,0.6), 0 0 30px rgba(0,212,255,0.3);
  line-height: 1;
}
.sb-date { font-size: 10px; color: var(--sub); letter-spacing: 0.5px; margin-top: 2px; }
.sb-right { display: flex; align-items: center; gap: 8px; }
.battery-wrap { display: flex; align-items: center; gap: 5px; }
.battery-body {
  width: 26px; height: 13px; border: 1.5px solid rgba(0,212,255,0.35);
  border-radius: 3px; padding: 2px; position: relative; background: rgba(0,0,0,0.4);
}
.battery-body::after {
  content: ''; position: absolute; right: -5px; top: 50%; transform: translateY(-50%);
  width: 3px; height: 6px; background: rgba(0,212,255,0.35); border-radius: 0 2px 2px 0;
}
.battery-fill { height: 100%; border-radius: 1px; transition: width 1.5s ease, background 1s; background: var(--green); }
.battery-pct { font-family: 'Orbitron', monospace; font-size: 9px; color: var(--sub); }

/* ── Model selector row ── */
.model-row {
  display: flex; align-items: center; gap: 6px;
  padding: 5px 14px;
  border-bottom: 0.5px solid var(--border);
  background: rgba(0,0,0,0.25);
  flex-shrink: 0;
}
.model-label { font-size: 9px; color: var(--sub); white-space: nowrap; }
.model-sel {
  flex: 1;
  background: rgba(0,212,255,0.04);
  border: 0.5px solid rgba(0,212,255,0.18);
  color: var(--cyan); font-size: 9px; border-radius: 6px;
  padding: 3px 6px; outline: none; cursor: pointer;
  font-family: 'JetBrains Mono', monospace;
}
.model-sel option { background: #030810; }

/* ── Avatar Area ── */
.avatar-area {
  display: flex; flex-direction: column; align-items: center;
  padding: 12px 20px 6px; flex-shrink: 0;
}
.avatar-outer { position: relative; width: 82px; height: 82px; }
.avatar-ring1, .avatar-ring2 {
  position: absolute; inset: 0; border-radius: 50%;
  border: 1.5px solid rgba(0,212,255,0.2);
  animation: ringRotate 8s linear infinite;
}
.avatar-ring2 { animation-duration: 5s; animation-direction: reverse; border-color: rgba(123,47,255,0.2); }
.avatar-core {
  position: absolute; inset: 10px; border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, rgba(0,212,255,0.15), rgba(5,12,20,0.9));
  border: 2px solid rgba(0,212,255,0.3);
  display: flex; align-items: center; justify-content: center;
  font-size: 34px; cursor: pointer; transition: all 0.3s;
  box-shadow: 0 0 16px rgba(0,212,255,0.2), inset 0 0 16px rgba(0,212,255,0.05);
}
.avatar-core:hover { transform: scale(1.05); }
.avatar-outer.state-listen .avatar-core {
  border-color: var(--red);
  box-shadow: 0 0 24px rgba(255,42,94,0.5), inset 0 0 16px rgba(255,42,94,0.08);
  animation: listenPulse 0.7s ease-in-out infinite;
}
.avatar-outer.state-think .avatar-core {
  border-color: var(--amber);
  box-shadow: 0 0 24px rgba(255,183,0,0.5), inset 0 0 16px rgba(255,183,0,0.08);
  animation: thinkSpin 1.5s linear infinite;
}
.avatar-outer.state-speak .avatar-core {
  border-color: var(--green);
  box-shadow: 0 0 24px rgba(0,255,136,0.5), inset 0 0 16px rgba(0,255,136,0.08);
  animation: speakBounce 0.4s ease-in-out infinite;
}
@keyframes ringRotate { to { transform: rotate(360deg); } }
@keyframes listenPulse {
  0%,100% { transform: scale(1); box-shadow: 0 0 18px rgba(255,42,94,0.4), inset 0 0 16px rgba(255,42,94,0.06); }
  50% { transform: scale(1.06); box-shadow: 0 0 32px rgba(255,42,94,0.7), inset 0 0 20px rgba(255,42,94,0.12); }
}
@keyframes thinkSpin { to { box-shadow: 0 0 28px rgba(255,183,0,0.6), 0 0 0 4px rgba(255,183,0,0.08), inset 0 0 16px rgba(255,183,0,0.1); } }
@keyframes speakBounce { 0%,100% { transform: scale(1); } 50% { transform: scale(1.04); } }

.ai-label {
  font-family: 'Orbitron', monospace; font-size: 13px; font-weight: 700;
  color: var(--cyan); letter-spacing: 5px; margin-top: 8px;
  text-shadow: 0 0 10px rgba(0,212,255,0.5);
}
.ai-status {
  font-size: 10px; color: var(--sub); margin-top: 4px; letter-spacing: 0.5px;
  min-height: 15px; text-align: center;
}

/* ── Emoji Bar ── */
.emoji-bar {
  display: flex; justify-content: center; flex-wrap: wrap;
  gap: 4px; padding: 4px 16px; flex-shrink: 0;
}
.emoji-btn {
  font-size: 16px; padding: 3px 5px; border-radius: 8px; cursor: pointer;
  border: 1px solid transparent; background: rgba(255,255,255,0.03);
  transition: all 0.15s; user-select: none; line-height: 1;
}
.emoji-btn:hover { background: rgba(0,212,255,0.1); border-color: rgba(0,212,255,0.3); transform: scale(1.2) translateY(-1px); }
.emoji-btn.active { background: rgba(0,212,255,0.15); border-color: rgba(0,212,255,0.5); transform: scale(1.15); }

/* ── Message Display ── */
.msg-display {
  margin: 0 14px;
  padding: 10px 14px;
  background: rgba(0,0,0,0.45);
  border: 0.5px solid var(--border);
  border-radius: 16px;
  min-height: 80px;
  max-height: 100px;
  overflow-y: auto;
  display: flex; flex-direction: column; gap: 6px;
  flex-shrink: 0; position: relative;
  scrollbar-width: thin; scrollbar-color: rgba(123,47,255,0.4) transparent;
}
.msg-display::before {
  content: ''; position: absolute; inset: 0; border-radius: 16px;
  background: linear-gradient(135deg, rgba(0,212,255,0.03) 0%, transparent 50%);
  pointer-events: none;
}
.msg-display::-webkit-scrollbar { width: 3px; }
.msg-display::-webkit-scrollbar-thumb { background: rgba(123,47,255,0.5); border-radius: 2px; }
.msg-row { display: flex; align-items: flex-start; gap: 7px; animation: msgIn 0.25s ease; }
@keyframes msgIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
.msg-tag {
  font-family: 'Orbitron', monospace; font-size: 8px; padding: 2px 5px;
  border-radius: 4px; flex-shrink: 0; margin-top: 1px; letter-spacing: 0.5px;
}
.msg-tag.ai { background: rgba(0,212,255,0.12); color: var(--cyan); border: 0.5px solid rgba(0,212,255,0.3); }
.msg-tag.user { background: rgba(123,47,255,0.15); color: var(--purple2); border: 0.5px solid rgba(123,47,255,0.35); }
.msg-tag.think { background: rgba(255,183,0,0.1); color: var(--amber); border: 0.5px solid rgba(255,183,0,0.3); }
.msg-text { font-size: 11px; color: var(--text); line-height: 1.5; word-break: break-all; }
.msg-text.thinking { color: rgba(255,183,0,0.75); font-style: italic; font-size: 10px; }

/* ── Waveform ── */
.waveform {
  display: flex; align-items: center; justify-content: center;
  gap: 3px; height: 28px; flex-shrink: 0; opacity: 0; transition: opacity 0.3s;
}
.waveform.active { opacity: 1; }
.wv-bar {
  width: 3.5px;
  background: linear-gradient(to top, var(--cyan), var(--cyan2));
  border-radius: 2px; animation: wvAnim 0.7s ease-in-out infinite;
}
.wv-bar:nth-child(1){animation-delay:0s;height:4px}
.wv-bar:nth-child(2){animation-delay:.08s;height:8px}
.wv-bar:nth-child(3){animation-delay:.16s;height:14px}
.wv-bar:nth-child(4){animation-delay:.24s;height:20px}
.wv-bar:nth-child(5){animation-delay:.32s;height:24px}
.wv-bar:nth-child(6){animation-delay:.40s;height:24px}
.wv-bar:nth-child(7){animation-delay:.32s;height:20px}
.wv-bar:nth-child(8){animation-delay:.24s;height:14px}
.wv-bar:nth-child(9){animation-delay:.16s;height:8px}
.wv-bar:nth-child(10){animation-delay:.08s;height:4px}
@keyframes wvAnim { 0%,100%{transform:scaleY(0.3)} 50%{transform:scaleY(1)} }

/* ── Control Grid ── */
.ctrl-grid {
  display: grid; grid-template-columns: repeat(3,1fr);
  gap: 7px; padding: 5px 14px; flex-shrink: 0;
}
.ctrl-btn {
  display: flex; flex-direction: column; align-items: center;
  gap: 3px; padding: 9px 6px; border-radius: 14px;
  border: 0.5px solid rgba(0,212,255,0.12);
  background: rgba(5,12,20,0.7); cursor: pointer;
  transition: all 0.2s; user-select: none;
}
.ctrl-btn:hover {
  background: rgba(0,212,255,0.07); border-color: rgba(0,212,255,0.3);
  transform: translateY(-2px); box-shadow: 0 4px 16px rgba(0,212,255,0.15);
}
.ctrl-btn:active { transform: scale(0.96) translateY(0); }
.ctrl-btn.on-green { background: rgba(0,255,136,0.08); border-color: rgba(0,255,136,0.4); box-shadow: 0 0 12px rgba(0,255,136,0.15); }
.ctrl-btn.on-red {
  background: rgba(255,42,94,0.1); border-color: rgba(255,42,94,0.45);
  box-shadow: 0 0 14px rgba(255,42,94,0.2); animation: redGlow 1s ease-in-out infinite;
}
.ctrl-btn.on-cyan { background: rgba(0,212,255,0.1); border-color: rgba(0,212,255,0.4); box-shadow: 0 0 12px rgba(0,212,255,0.2); }
@keyframes redGlow {
  0%,100%{box-shadow:0 0 10px rgba(255,42,94,0.2)}
  50%{box-shadow:0 0 24px rgba(255,42,94,0.5)}
}
.btn-icon { font-size: 19px; line-height: 1; }
.btn-label { font-size: 9.5px; color: var(--sub); font-weight: 500; letter-spacing: 0.3px; }

/* ── Volume Row ── */
.vol-row {
  display: flex; align-items: center; gap: 8px;
  padding: 0 16px 4px; flex-shrink: 0;
}
.vol-icon { font-size: 14px; color: var(--sub); flex-shrink: 0; }
.vol-slider {
  flex: 1; -webkit-appearance: none; height: 4px;
  border-radius: 2px; background: rgba(255,255,255,0.08); outline: none; cursor: pointer;
}
.vol-slider::-webkit-slider-thumb {
  -webkit-appearance: none; width: 15px; height: 15px; border-radius: 50%;
  background: radial-gradient(circle, var(--cyan2), var(--cyan)); cursor: pointer;
  box-shadow: 0 0 8px rgba(0,212,255,0.6); transition: transform 0.1s;
}
.vol-slider::-webkit-slider-thumb:hover { transform: scale(1.2); }
.vol-val { font-family:'Orbitron',monospace; font-size:9px; color:var(--sub); width:26px; text-align:right; }

/* ── Image upload row ── */
.img-row {
  display: flex; align-items: center; gap: 8px;
  padding: 0 14px 4px; flex-shrink: 0;
}
.img-upload-btn {
  display: flex; align-items: center; gap: 5px; cursor: pointer;
  padding: 5px 10px; border-radius: 8px;
  border: 0.5px dashed rgba(0,212,255,0.25);
  background: rgba(0,212,255,0.03);
  font-size: 10px; color: var(--sub); transition: all 0.2s;
  flex: 1; justify-content: center;
}
.img-upload-btn:hover { border-color: rgba(0,212,255,0.5); background: rgba(0,212,255,0.07); color: var(--cyan); }
.img-upload-btn input { display: none; }
#imgPreviewThumb {
  width: 36px; height: 36px; border-radius: 6px; object-fit: cover;
  border: 1px solid rgba(0,212,255,0.25); display: none;
}
.img-clear-btn {
  font-size: 14px; cursor: pointer; padding: 4px; color: var(--red);
  background: rgba(255,42,94,0.08); border-radius: 6px;
  border: 0.5px solid rgba(255,42,94,0.2); display: none;
  transition: all 0.2s;
}
.img-clear-btn:hover { background: rgba(255,42,94,0.2); }

/* ── Text Input ── */
.text-input-row {
  display: flex; align-items: center; gap: 6px;
  padding: 0 14px 5px; flex-shrink: 0;
}
.text-inp {
  flex: 1; padding: 8px 12px;
  background: rgba(0,0,0,0.4);
  border: 0.5px solid rgba(0,212,255,0.15);
  border-radius: 10px; color: var(--text); font-size: 11px;
  font-family: 'Noto Sans TC', sans-serif; outline: none; transition: border-color 0.2s;
}
.text-inp::placeholder { color: rgba(74,106,132,0.6); }
.text-inp:focus { border-color: rgba(0,212,255,0.35); }
.send-btn {
  padding: 8px 13px; background: rgba(0,212,255,0.1);
  border: 0.5px solid rgba(0,212,255,0.3); border-radius: 10px;
  color: var(--cyan); font-size: 11px; cursor: pointer; transition: all 0.2s;
  font-family: 'Noto Sans TC', sans-serif; flex-shrink: 0;
}
.send-btn:hover { background: rgba(0,212,255,0.2); transform: scale(1.04); }
.send-btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }

/* ── Mic Button ── */
.mic-area {
  display: flex; flex-direction: column; align-items: center;
  gap: 4px; padding: 0 16px 8px; flex-shrink: 0;
}
.mic-btn {
  position: relative; width: 64px; height: 64px; border-radius: 50%; border: none;
  background: linear-gradient(135deg, var(--purple), #3d1a8a); cursor: pointer;
  display: flex; align-items: center; justify-content: center; font-size: 26px;
  box-shadow: 0 0 24px rgba(123,47,255,0.45), 0 4px 16px rgba(0,0,0,0.4);
  transition: all 0.2s; user-select: none;
}
.mic-btn::before, .mic-btn::after {
  content: ''; position: absolute; inset: -8px; border-radius: 50%;
  border: 1px solid rgba(123,47,255,0.25); animation: micRipple 2.5s ease-out infinite;
}
.mic-btn::after { animation-delay: 1.25s; }
.mic-btn:hover { transform: scale(1.06); box-shadow: 0 0 36px rgba(123,47,255,0.65), 0 4px 20px rgba(0,0,0,0.4); }
.mic-btn:active { transform: scale(0.95); }
.mic-btn.recording {
  background: linear-gradient(135deg, var(--red), #b01030);
  box-shadow: 0 0 30px rgba(255,42,94,0.6);
}
.mic-btn.recording::before, .mic-btn.recording::after { border-color: rgba(255,42,94,0.3); }
@keyframes micRipple { 0% { transform: scale(1); opacity: 0.6; } 100% { transform: scale(1.5); opacity: 0; } }
.mic-label { font-size: 10px; color: var(--sub); letter-spacing: 0.3px; }

/* ── Memory badge ── */
.mem-badge {
  font-family: 'Orbitron', monospace; font-size: 8px; color: var(--sub);
  text-align: center; padding-bottom: 2px; flex-shrink: 0;
  letter-spacing: 0.5px;
}

/* ── Footer ── */
.footer {
  text-align: center; padding: 4px 16px 8px; font-size: 9px;
  color: rgba(74,106,132,0.4); border-top: 0.5px solid rgba(0,212,255,0.06);
  letter-spacing: 0.5px; flex-shrink: 0;
}
.footer a { color: rgba(0,212,255,0.3); text-decoration: none; }
.footer a:hover { color: rgba(0,212,255,0.6); }

/* ── Toast ── */
.toast {
  position: fixed; top: 24px; left: 50%;
  transform: translateX(-50%) translateY(-70px);
  background: rgba(0,212,255,0.1);
  border: 0.5px solid rgba(0,212,255,0.35); color: var(--cyan);
  padding: 7px 22px; border-radius: 20px; font-size: 11px;
  transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  z-index: 999; white-space: nowrap; backdrop-filter: blur(12px);
  box-shadow: 0 0 16px rgba(0,212,255,0.2); font-family: 'Noto Sans TC', sans-serif;
}
.toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="toast" id="toast"></div>

<div class="phone">

  <!-- PUTER AUTH BANNER -->
  <div class="puter-banner" id="puterBanner">
    <div class="puter-info" id="puterInfo"><span>Puter AI</span> · 登入後使用免費AI</div>
    <button class="puter-action" id="puterBtn">🔑 登入</button>
  </div>

  <!-- STATUS BAR -->
  <div class="statusbar">
    <div class="sb-left">
      <div class="sb-time" id="clockEl">00:00</div>

<script>
/* ═══════════════════════════════════════
   小智 AI + Puter 登入 + CoT 推理 + 多模態
═══════════════════════════════════════ */

// ── State ──
var VOL       = 0.8;
var STANDBY   = true;
var LISTEN    = false;
var RECORDING = false;
var SPEAKING  = false;
var CUR_EMO   = '🤖';
var recog     = null;
var curUtt    = null;
var history   = [];
var MAX_MEM   = 20;
var currentModel = 'anthropic/claude-3.5-haiku';
var pendingImage = null; // { base64, mimeType }
var PUTER_LOGGED_IN = false;

// ── System Prompt (CoT) ──
var SYS_PROMPT = '你是「小智」，一個親切的繁體中文AI助手，使用台灣日常用語。\n在回答前，先以 [思考] 標記展示簡短推理過程，再以 [回答] 給出實際回應，回答在60字以內，語氣友善像朋友。\n請勿使用簡體字或Markdown格式。';

// ── Clock ──
function updateClock() {
  var n = new Date();
  var h = ('0'+n.getHours()).slice(-2);
  var m = ('0'+n.getMinutes()).slice(-2);
  document.getElementById('clockEl').textContent = h+':'+m;
  var days = ['日','一','二','三','四','五','六'];
  var Y = n.getFullYear(), M = ('0'+(n.getMonth()+1)).slice(-2), D = ('0'+n.getDate()).slice(-2);
  document.getElementById('dateEl').textContent = Y+'/'+M+'/'+D+'  週'+days[n.getDay()];
}
setInterval(updateClock, 1000);
updateClock();

// ── Battery ──
(function(){
  function setBat(pct){
    document.getElementById('batFill').style.width = pct+'%';
    document.getElementById('batPct').textContent = pct+'%';
    document.getElementById('batFill').style.background = pct>30?'#00ff88':pct>15?'#ffb700':'#ff2a5e';
  }
  if(navigator.getBattery){
    navigator.getBattery().then(function(b){
      function upd(){ setBat(Math.round(b.level*100)); }
      upd(); b.addEventListener('levelchange', upd);
    });
  } else { setBat(80); }
})();

// ── Toast ──
var toastTimer = null;
function toast(msg, dur) {
  var el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  if(toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.classList.remove('show'); }, dur||2000);
}

// ── Emoji ──
document.getElementById('emojiBar').addEventListener('click', function(e){
  var btn = e.target.closest('.emoji-btn');
  if(!btn) return;
  document.querySelectorAll('.emoji-btn').forEach(function(b){ b.classList.remove('active'); });
  btn.classList.add('active');
  CUR_EMO = btn.dataset.e;
  setAvatar('idle');
  toast('表情切換 '+CUR_EMO);
});

// ── Avatar ──
function setAvatar(state){
  var outer = document.getElementById('avatarOuter');
  var core  = document.getElementById('avatarCore');
  outer.className = 'avatar-outer';
  if(state==='listen'){ outer.classList.add('state-listen'); core.textContent = '🎙️'; }
  else if(state==='think'){ outer.classList.add('state-think'); core.textContent = '🤔'; }
  else if(state==='speak'){ outer.classList.add('state-speak'); core.textContent = '🗣️'; }
  else { core.textContent = CUR_EMO; }
}

// ── Status ──
function setStatus(txt){ document.getElementById('aiStatus').textContent = txt; }

// ── Waveform ──
function setWave(on){ document.getElementById('waveform').classList.toggle('active', on); }

// ── Model ──
function changeModel(val){
  currentModel = val;
  toast('✅ 模型：'+val.replace('anthropic/',''));
}

// ── Memory UI ──
function updateMemUI(){
  document.getElementById('memBadge').textContent = 'MEM '+history.length+'/'+MAX_MEM;
}

// ── Image upload ──
function handleImageSelect(e){
  var file = e.target.files[0];
  if(!file){ clearImage(); return; }
  var reader = new FileReader();
  reader.onload = function(){
    var dataUrl = reader.result;
    pendingImage = { base64: dataUrl.split(',')[1], mimeType: file.type };
    document.getElementById('imgPreviewThumb').src = dataUrl;
    document.getElementById('imgPreviewThumb').style.display = 'block';
    document.getElementById('imgClearBtn').style.display = 'block';
    document.getElementById('imgBtnLabel').textContent = '圖片已載入 ✓';
    toast('📷 圖片已載入，多模態啟用');
  };
  reader.readAsDataURL(file);
}
function clearImage(){
  pendingImage = null;
  document.getElementById('imgInput').value = '';
  document.getElementById('imgPreviewThumb').style.display = 'none';
  document.getElementById('imgClearBtn').style.display = 'none';
  document.getElementById('imgBtnLabel').textContent = '上傳圖片（多模態）';
}

// ── Messages ──
var MAX_CHARS = 35;
function addMsg(role, text, isThink){
  var box = document.getElementById('msgDisplay');
  var row = document.createElement('div'); row.className = 'msg-row';
  var tag = document.createElement('span');
  tag.className = 'msg-tag '+(isThink?'think':role==='user'?'user':'ai');
  tag.textContent = isThink?'思考':role==='user'?'我':'AI';
  var txt = document.createElement('span');
  txt.className = 'msg-text'+(isThink?' thinking':'');
  var display = text.length > MAX_CHARS ? text.substring(0, MAX_CHARS)+'…' : text;
  txt.textContent = display;
  row.appendChild(tag); row.appendChild(txt);
  box.appendChild(row);
  box.scrollTop = box.scrollHeight;
}

function clearAll(){
  document.getElementById('msgDisplay').innerHTML = '';
  history = [];
  updateMemUI();
  addMsg('ai','已清除，重新開始！');
  toast('🗑️ 對話已清除');
}

// ── Volume ──
function setVolume(v){
  VOL = v/100;
  document.getElementById('volVal').textContent = v+'%';
  if(curUtt) curUtt.volume = VOL;
}
function adjustVol(d){
  var s = document.getElementById('volSlider');
  var v = Math.max(0, Math.min(100, parseInt(s.value)+d));
  s.value = v; setVolume(v);
  toast((d>0?'🔊 ':'🔉 ')+'音量 '+v+'%');
}

// ── TTS ──
function speakTW(text){
  if(!window.speechSynthesis){ toast('⚠️ 瀏覽器不支援語音'); return; }
  stopSpeaking();
  SPEAKING = true; setAvatar('speak'); setStatus('🗣️ 語音回應中…'); setWave(true);
  var u = new SpeechSynthesisUtterance(text);
  curUtt = u; u.volume = VOL; u.rate = 0.93; u.pitch = 1.05; u.lang = 'zh-TW';
  var voices = speechSynthesis.getVoices();
  var tw = voices.find(function(v){ return v.lang==='zh-TW'; }) ||
           voices.find(function(v){ return v.lang.startsWith('zh'); }) || null;
  if(tw) u.voice = tw;
  u.onend = u.onerror = function(){
    SPEAKING = false; setAvatar('idle'); setStatus('待命中 · 點擊麥克風開始'); setWave(false); curUtt = null;
  };
  speechSynthesis.speak(u);
}
function stopSpeaking(){
  if(window.speechSynthesis) speechSynthesis.cancel();
  SPEAKING = false; curUtt = null; setAvatar('idle'); setWave(false); setStatus('已停止');
}

// ── Standby / Listen ──
function toggleStandby(){
  STANDBY = !STANDBY;
  var b = document.getElementById('btnStandby');
  if(STANDBY){ b.className='ctrl-btn on-green'; setStatus('⚡ 待命中'); toast('⚡ 待命模式開啟'); }
  else { b.className='ctrl-btn'; setStatus('💤 待機中'); toast('💤 待機中'); if(RECORDING) stopRec(); stopSpeaking(); }
}
function toggleListen(){
  LISTEN = !LISTEN;
  var b = document.getElementById('btnListen');
  if(LISTEN){ b.className='ctrl-btn on-cyan'; toast('👂 持續聆聽開啟'); startRec(); }
  else { b.className='ctrl-btn'; toast('聆聽關閉'); if(RECORDING) stopRec(); }
}

// ── Mic ──
function toggleMic(){
  if(!STANDBY){ toast('⚠️ 請先開啟待命'); return; }
  if(SPEAKING) stopSpeaking();
  RECORDING ? stopRec() : startRec();
}
function startRec(){
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ toast('⚠️ 請使用 Chrome 瀏覽器'); return; }
  recog = new SR(); recog.lang='zh-TW'; recog.continuous=false; recog.interimResults=true;
  RECORDING = true;
  var micBtn = document.getElementById('micBtn');
  micBtn.classList.add('recording'); micBtn.textContent='⏹️';
  document.getElementById('micLabel').textContent='錄音中 · 點擊停止';
  document.getElementById('btnListen').classList.add('on-red');
  setAvatar('listen'); setStatus('🎙️ 聆聽中，請說話…'); setWave(true);
  var final = '';
  recog.onresult = function(e){
    var interim='';
    for(var i=e.resultIndex;i<e.results.length;i++){
      var t=e.results[i][0].transcript;
      if(e.results[i].isFinal) final+=t; else interim+=t;
    }
    var disp=(final||interim).substring(0,16);
    if(disp) setStatus('🎙️ '+disp+(disp.length>=16?'…':''));
  };
  recog.onend = function(){
    RECORDING = false;
    micBtn.classList.remove('recording'); micBtn.textContent='🎤';
    document.getElementById('micLabel').textContent='點擊開始語音輸入';
    document.getElementById('btnListen').className=LISTEN?'ctrl-btn on-cyan':'ctrl-btn';
    setWave(false);
    if(final.trim()){ addMsg('user',final.trim()); askAI(final.trim()); }
    else { setAvatar('idle'); setStatus('未偵測到語音，請再試'); }
  };
  recog.onerror = function(e){
    RECORDING=false; micBtn.classList.remove('recording'); micBtn.textContent='🎤';
    document.getElementById('micLabel').textContent='點擊開始語音輸入';
    setWave(false); setAvatar('idle');
    var emap={'no-speech':'未偵測語音','not-allowed':'麥克風被拒','network':'網路錯誤','aborted':'已取消'};
    setStatus('⚠️ '+(emap[e.error]||e.error)); toast('⚠️ '+(emap[e.error]||e.error));
  };
  recog.start();
}
function stopRec(){ if(recog) recog.stop(); }

// ── Text send ──
function sendText(){
  var inp = document.getElementById('textInput');
  var txt = inp.value.trim();
  if(!txt && !pendingImage) return;
  if(!STANDBY){ toast('⚠️ 請先開啟待命'); return; }
  addMsg('user', txt || '[圖片]');
  askAI(txt);
  inp.value = '';
}

// ── Puter response parser ──
function parsePuterResponse(res){
  if(!res) return '';
  if(typeof res==='string') return res.trim();
  if(typeof res.text==='string') return res.text.trim();
  if(res.message&&res.message.content!==undefined){
    var mc=res.message.content;
    if(typeof mc==='string') return mc.trim();
    if(Array.isArray(mc)&&mc[0]){
      if(typeof mc[0]==='string') return mc[0].trim();
      if(mc[0].text) return mc[0].text.trim();
    }
  }
  if(res.content!==undefined){
    var c=res.content;
    if(typeof c==='string') return c.trim();
    if(Array.isArray(c)&&c[0]){
      if(typeof c[0]==='string') return c[0].trim();
      if(c[0].text) return c[0].text.trim();
    }
  }
  var s=String(res);
  return (s==='[object Object]'||s==='undefined'||s==='null')?'':s.trim();
}

// ── AI Engine ──
async function askAI(text){
  if(!STANDBY){ toast('⚠️ 請先開啟待命'); return; }
  setAvatar('think'); setStatus('🤔 小智思考中…'); setWave(true);
  document.getElementById('sendBtn').disabled = true;

  // Build message content (支援多模態)
  var userContent;
  if(pendingImage){
    userContent = [
      { type:'image_url', image_url:{ url:'data:'+pendingImage.mimeType+';base64,'+pendingImage.base64 } }
    ];
    if(text) userContent.push({ type:'text', text:text });
    clearImage();
  } else {
    userContent = text || '';
  }

  history.push({ role:'user', content: userContent });
  if(history.length > MAX_MEM) history.splice(0, 2);
  updateMemUI();

  var msgs = history.slice(-10);
  var answer = '';
  var source = '';

  // ① Puter AI 已登入模式（正式配額）
  if(!answer && PUTER_LOGGED_IN && typeof puter !== 'undefined' && puter.ai){
    try {
      setStatus('🔗 連線 Puter AI（登入模式）…');
      var res = await puter.ai.chat(msgs, {
        model: currentModel,
        system: SYS_PROMPT,
        testMode: false
      });
      answer = parsePuterResponse(res);
      source = 'Puter(登入)';
      if(!answer) throw new Error('回傳空值');
    } catch(e1){
      console.warn('[Puter 登入]', e1.message);
      answer = '';
    }
  }

  // ② Puter AI 匿名模式（免登入，有速率限制）
  if(!answer && typeof puter !== 'undefined' && puter.ai){
    try {
      setStatus('🔗 連線 Puter AI（匿名模式）…');
      // 匿名模式只支援 gpt-4o-mini
      var anonRes = await puter.ai.chat(msgs, {
        model: 'gpt-4o-mini',
        system: SYS_PROMPT,
        testMode: true
      });
      answer = parsePuterResponse(anonRes);
      source = 'Puter(匿名)';
      if(!answer) throw new Error('回傳空值');
    } catch(e2){
      console.warn('[Puter 匿名]', e2.message);
      answer = '';
    }
  }

  // ③ Anthropic API 直接呼叫（fallback）
  if(!answer){
    try {
      setStatus('🔄 切換 Anthropic API…');
      var resp = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: 'claude-haiku-4-5-20251001',
          max_tokens: 300,
          system: SYS_PROMPT,
          messages: msgs
        })
      });
      if(resp.ok){
        var d = await resp.json();
        if(d.content && d.content[0] && d.content[0].text){
          answer = d.content[0].text.trim();
          source = 'Anthropic';
        }
      }
    } catch(e3){
      console.warn('[Anthropic]', e3.message);
    }
  }

  console.log('[AI Source]', source, '|', (answer||'').substring(0,60));
  if(!answer){ answer = '⚠️ 目前所有連線皆失敗，請確認網路或稍後再試。'; }

  // 解析 CoT：[思考] ... [回答] ...
  var thoughtMatch = /\[思考\]([\s\S]*?)(?=\[回答\]|$)/i.exec(answer);
  var answerMatch  = /\[回答\]([\s\S]*)/i.exec(answer);

  if(thoughtMatch && thoughtMatch[1].trim()){
    addMsg('ai', thoughtMatch[1].trim(), true);
  }

  var finalAnswer = answerMatch ? answerMatch[1].trim() : (thoughtMatch ? '' : answer);
  if(!finalAnswer && answerMatch) finalAnswer = answerMatch[1].trim();
  if(!finalAnswer) finalAnswer = answer;

  history.push({ role:'assistant', content: answer });
  if(history.length > MAX_MEM) history.splice(0, 2);
  updateMemUI();

  addMsg('ai', finalAnswer);
  setAvatar('speak');
  speakTW(finalAnswer);
  document.getElementById('sendBtn').disabled = false;
}

// ── Avatar long-press → text input ──
(function(){
  var timer;
  var el = document.getElementById('avatarCore');
  function startPress(){ timer = setTimeout(function(){ var t=prompt('請輸入文字訊息：'); if(t&&t.trim()){ addMsg('user',t.trim()); askAI(t.trim()); }}, 800); }
  function endPress(){ clearTimeout(timer); }
  el.addEventListener('mousedown', startPress);
  el.addEventListener('mouseup', endPress);
  el.addEventListener('mouseleave', endPress);
  el.addEventListener('touchstart', function(e){ e.preventDefault(); startPress(); });
  el.addEventListener('touchend', endPress);
})();

function updateBanner(loggedIn, username){

    btn.className    = 'puter-action signout';
    btn.textContent  = '登出';
  } else {
    banner.className = 'puter-banner';
    info.className   = 'puter-info';
    info.innerHTML   = '<span>Puter AI</span> · 登入後使用免費AI';
    btn.className    = 'puter-action';
    btn.textContent  = '🔑 登入';
  }
}

document.getElementById('puterBtn').addEventListener('click', async function(){
  var btn = this;
  if(PUTER_LOGGED_IN){
    if(typeof puter!=='undefined'&&puter.auth) puter.auth.signOut();
    updateBanner(false,''); toast('已登出 Puter'); return;
  }
  if(typeof puter==='undefined'){ toast('⚠️ Puter.js 尚未載入，請重新整理頁面'); return; }
  btn.textContent='登入中…'; btn.disabled=true;
  try {
    await puter.auth.signIn();
    var user = await puter.auth.getUser();
    updateBanner(true, user.username||'使用者');
    toast('✅ 登入成功！小智準備好了', 2500);
    setTimeout(function(){ speakTW('你好！我是小智，很高興為你服務！'); }, 400);
  } catch(e){
    console.warn('Login err:', e); toast('⚠️ 登入取消或失敗');
    btn.textContent='🔑 登入'; btn.disabled=false;
  }
});

async function initPuter(){
  if(typeof puter==='undefined') return;
  try {
    if(puter.auth.isSignedIn()){
      var user = await puter.auth.getUser();
      updateBanner(true, user.username||'使用者');
    }
  } catch(e){ console.warn('initPuter:', e); }
}

// ── Voices ──
if(window.speechSynthesis){
  speechSynthesis.onvoiceschanged = function(){
    var v = speechSynthesis.getVoices().find(function(x){ return x.lang==='zh-TW'; });
    if(v) setStatus('✅ 語音就緒 ('+v.name.substring(0,10)+') · 點擊麥克風');
  };
  speechSynthesis.getVoices();
}

// ── Welcome ──
setTimeout(function(){
  toast('👋 小智 AI 就緒！', 2000);
  initPuter();
  setTimeout(function(){ speakTW('你好！我是小智，很高興為你服務！'); }, 800);
}, 700);
</script>
